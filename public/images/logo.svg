<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="100%" height="100%">
  <!-- Building Outline Emblem -->
  <g transform="translate(10, 8)">
    <!-- Tower 1 -->
    <rect x="2" y="16" width="10" height="28" rx="1.5" fill="none" stroke="#1F2326" stroke-width="2.2" />
    <line x1="5" y1="22" x2="9" y2="22" stroke="#1F2326" stroke-width="1.8" />
    <line x1="5" y1="28" x2="9" y2="28" stroke="#1F2326" stroke-width="1.8" />
    <line x1="5" y1="34" x2="9" y2="34" stroke="#1F2326" stroke-width="1.8" />
    
    <!-- Tower 2 (Tall Central) -->
    <rect x="15" y="4" width="12" height="40" rx="1.5" fill="none" stroke="#1F2326" stroke-width="2.2" />
    <path d="M 15 4 L 21 0 L 27 4" fill="none" stroke="#B08A4E" stroke-width="2.2" stroke-linecap="round" />
    <line x1="18.5" y1="12" x2="23.5" y2="12" stroke="#B08A4E" stroke-width="1.8" />
    <line x1="18.5" y1="18" x2="23.5" y2="18" stroke="#1F2326" stroke-width="1.8" />
    <line x1="18.5" y1="24" x2="23.5" y2="24" stroke="#1F2326" stroke-width="1.8" />
    <line x1="18.5" y1="30" x2="23.5" y2="30" stroke="#1F2326" stroke-width="1.8" />
    <line x1="18.5" y1="36" x2="23.5" y2="36" stroke="#1F2326" stroke-width="1.8" />

    <!-- Tower 3 -->
    <rect x="30" y="12" width="10" height="32" rx="1.5" fill="none" stroke="#1F2326" stroke-width="2.2" />
    <line x1="33" y1="18" x2="37" y2="18" stroke="#1F2326" stroke-width="1.8" />
    <line x1="33" y1="24" x2="37" y2="24" stroke="#1F2326" stroke-width="1.8" />
    <line x1="33" y1="30" x2="37" y2="30" stroke="#1F2326" stroke-width="1.8" />
    <line x1="33" y1="36" x2="37" y2="36" stroke="#1F2326" stroke-width="1.8" />
    
    <!-- Base Foundation Line -->
    <line x1="0" y1="44" x2="42" y2="44" stroke="#B08A4E" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="31" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="21" font-weight="700" fill="#1F2326" letter-spacing="2.5">GLORIOUS</text>
  <text x="65" y="45" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#7A7569" letter-spacing="3.2">REAL ESTATES</text>
</svg>
